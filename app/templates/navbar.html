<link rel="stylesheet" href="{{ url_for('static', filename='/styles/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='/styles/navbarstyle.css') }}">
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{url_for('home')}}"><img src="static\styles\moon-stars.svg" /></a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarElements"
      aria-controls="navbarElements"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarElements">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{{url_for('home')}}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('write') }}">Write</a>
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            {% if 'username' in session %}
            {{ session['username'] }}
            {% else %}
            Guest
            {% endif %}
          </a>
          <ul class="dropdown-menu">
            {% if 'username' in session %}
            <li><a class="dropdown-item" href="{{ url_for('logout') }}">Logout</a></li>
            {% else %}
            <li><a class="dropdown-item" href="{{ url_for('auth')}}">Login</a></li>
            <li><a class="dropdown-item" href="{{ url_for('new_user')}}">Register</a></li>
            {% endif %}
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">PLACEHOLDER</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('read') }}">Read Pages</a>
        </li>
      </ul>
    </div>
  </div>
